[package]
name = "ludo-royal-backend"
version = "0.1.0"
description = "Ludo Royal Club PHP Backend"
authors = ["Ludo Royal Club"]

[dependencies]
"php/runtime" = "*"

[[command]]
name = "php"
module = "php"
runner = { url = "https://php.wasmer.io", sha256 = "b473e6481e2364f7515c564a4f2c3b0b8b0c8b8b8b8b8b8b8b8b8b8b8b8b8b8b" }

[fs]
"/var/www" = "."
"/var/www/api" = "./api"

[env]
PHP_INI_SCAN_DIR = "/var/www"
